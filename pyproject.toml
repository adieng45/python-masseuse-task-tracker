[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masseuse-task-tracker"
version = "1.0.0"
description = "A dependency-free CLI for tracking massage appointments and follow-up tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
masseuse-tracker = "masseuse_tracker.cli:main"
